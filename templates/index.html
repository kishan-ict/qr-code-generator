<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Create and download a QR code from any text or URL.">
  <title>QR Generator</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
  <main class="page">
    <section class="card" aria-labelledby="page-title">
      <div class="qr-icon" aria-hidden="true">
        <span></span><span></span><span></span>
      </div>
      <p class="eyebrow">SIMPLE • FAST • FREE</p>
      <h1 id="page-title">QR Code Generator</h1>
      <p class="intro">Turn any link, event registration URL, message, or contact detail into a downloadable QR code.</p>

      <form method="post">
        <label for="text">Text or URL</label>
        <textarea id="text" name="text" rows="5" maxlength="2000" placeholder="https://example.com" required>{{ text }}</textarea>

        {% if error %}
          <p class="error" role="alert">{{ error }}</p>
        {% endif %}

        <button type="submit">Generate & Download PNG</button>
      </form>

      <div class="uses">
        <p>Great for:</p>
        <ul>
          <li>Sharing links</li>
          <li>Business & marketing</li>
          <li>Event registrations</li>
        </ul>
      </div>
    </section>
  </main>
</body>
</html>
